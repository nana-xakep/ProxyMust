<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-localize="testLogTitle">Proxy Test Log</title>
    <link href="css/common.css" rel="stylesheet" />
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        background: #0c0c0c;
        color: #d4d4d4;
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 11px;
        height: 100vh;
        overflow: hidden;
        padding: 4px 6px;
        display: flex;
        flex-direction: column;
    }
    .log-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #2a2a2a;
        padding-bottom: 3px;
        margin-bottom: 4px;
        flex-shrink: 0;
    }
    .log-title {
        font-size: 13px;
        font-weight: bold;
        color: #00e5ff;
        text-shadow: 0 0 8px rgba(0,229,255,0.3);
        letter-spacing: 0.5px;
    }
    .log-actions {
        display: flex;
        gap: 4px;
    }
    .log-actions button {
        background: none;
        border: 1px solid #444;
        color: #ccc;
        padding: 0 6px;
        border-radius: 3px;
        cursor: pointer;
        font-size: 10px;
        transition: 0.2s;
    }
    .log-actions button:hover {
        background: #2a2a2a;
        border-color: #888;
    }
    #pinLogBtn.pinned {
        border-color: #ffaa00;
        color: #ffaa00;
    }
    #pinLogBtn.pinned:hover {
        background: #2a2a2a;
        border-color: #ffaa00;
    }
    #logContainer {
        flex: 1;
        overflow-y: auto;
        padding-right: 2px;
    }
    #logContainer::-webkit-scrollbar {
        width: 4px;
    }
    #logContainer::-webkit-scrollbar-track {
        background: #1a1a1a;
    }
    #logContainer::-webkit-scrollbar-thumb {
        background: #444;
        border-radius: 2px;
    }
    #logContainer::-webkit-scrollbar-thumb:hover {
        background: #666;
    }
    @keyframes fadeIn {
        from { opacity: 0.4; transform: translateY(-2px); }
        to   { opacity: 1; transform: translateY(0); }
    }
    #emptyState {
        color: #555;
        text-align: center;
        margin-top: 30px;
        font-size: 12px;
        font-style: italic;
    }
    .flag-emoji {
        font-family: 'Twemoji Country Flags', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
        font-size: 1.1em;
        display: inline-block;
    }
</style>
</head>
<body>
    <div class="log-header">
        <div class="log-title">📋 <span data-localize="testLogTitle">Proxy Test Log</span></div>
        <div class="log-actions">
            <button id="pinLogBtn" style="background: none; border: 1px solid #444; color: #ccc; padding: 0 6px; border-radius: 3px; cursor: pointer; font-size: 10px; transition: 0.2s;">📌 <span data-localize="settingsContextMenuSetPin">Pin</span></button>
            <button id="clearLogBtn" data-localize="testLogClear">Clear</button>
            <button id="closeLogBtn" data-localize="testLogClose">Close</button>
        </div>
    </div>
    <div id="logContainer">
        <span data-localize="testLogReadiness" style="display:none;">Readiness for {0}: {1}% ({2}/{3})</span>
        <div id="emptyState" data-localize="testLogWaiting">Waiting for test to start...</div>
    </div>

<script src="js/jquery.min.js"></script>
<script src="lib/External.js"></script>
<script src="code/test-log.js"></script>
</body>
</html>
